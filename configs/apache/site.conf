ServerName web.lab.test

# TLS trust for the group lookups in LDAP (lab CA)
LDAPTrustedMode SSL
LDAPTrustedGlobalCert CA_BASE64 /certs/ca.crt

<VirtualHost *:80>
    ServerName web.lab.test
    DocumentRoot /var/www/html
    LogLevel info

    <Location "/">
        # Authentication: Kerberos (SPNEGO) with the service keytab
        AuthType GSSAPI
        AuthName "Kerberos SSO"
        GssapiAllowedMech krb5
        GssapiCredStore keytab:/etc/apache2/http.keytab
        GssapiLocalName On
        GssapiUseSessions Off

        # Authorization: membership of web-users in LDAP (read-only account)
        AuthLDAPURL "ldaps://ldap.lab.test/ou=people,dc=lab,dc=test?uid?sub"
        AuthLDAPBindDN "cn=sssd,ou=services,dc=lab,dc=test"
        AuthLDAPBindPassword "${SSSD_BIND_PASSWORD}"
        AuthLDAPGroupAttribute memberUid
        AuthLDAPGroupAttributeIsDN off
        Require ldap-group cn=web-users,ou=groups,dc=lab,dc=test
        AuthzSendForbiddenOnFailure On
    </Location>
</VirtualHost>
