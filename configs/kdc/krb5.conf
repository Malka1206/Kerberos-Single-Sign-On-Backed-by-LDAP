[libdefaults]
    default_realm = LAB.TEST
    dns_lookup_realm = false
    dns_lookup_kdc = false
    dns_canonicalize_hostname = false
    rdns = false
    forwardable = true
    ticket_lifetime = 10h
    renew_lifetime = 7d

[realms]
    LAB.TEST = {
        kdc = kdc.lab.test
        admin_server = kdc.lab.test
        database_module = openldap_ldapconf
    }

[domain_realm]
    .lab.test = LAB.TEST
    lab.test = LAB.TEST

[dbmodules]
    openldap_ldapconf = {
        db_library = kldap
        ldap_servers = ldaps://ldap.lab.test
        ldap_kerberos_container_dn = cn=kerberos,dc=lab,dc=test
        ldap_kdc_dn = cn=kdc,ou=services,dc=lab,dc=test
        ldap_kadmind_dn = cn=kadmin,ou=services,dc=lab,dc=test
        ldap_service_password_file = /var/lib/krb5kdc/service.keyfile
        ldap_conns_per_server = 5
    }

[logging]
    kdc = FILE:/var/log/krb5kdc.log
    kdc = STDERR
    admin_server = FILE:/var/log/kadmind.log
    admin_server = STDERR
    default = STDERR
