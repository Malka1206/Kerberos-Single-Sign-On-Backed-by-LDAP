[libdefaults]
    default_realm = LAB.TEST
    dns_lookup_realm = false
    dns_lookup_kdc = false
    dns_canonicalize_hostname = false
    rdns = false
    forwardable = true
    ticket_lifetime = 10h
    renew_lifetime = 7d
    default_ccache_name = FILE:/tmp/krb5cc_%{uid}

[realms]
    LAB.TEST = {
        kdc = kdc.lab.test
        admin_server = kdc.lab.test
    }

[domain_realm]
    .lab.test = LAB.TEST
    lab.test = LAB.TEST
