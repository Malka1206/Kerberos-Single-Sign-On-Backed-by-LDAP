[sssd]
config_file_version = 2
services = nss, pam
domains = lab.test

[nss]
filter_users = root
filter_groups = root

[pam]

[domain/lab.test]
id_provider = ldap
auth_provider = krb5
chpass_provider = krb5

access_provider = simple
simple_allow_groups = ssh-users

ldap_uri = ldaps://ldap.lab.test
ldap_search_base = dc=lab,dc=test
ldap_user_search_base = ou=people,dc=lab,dc=test
ldap_group_search_base = ou=groups,dc=lab,dc=test
ldap_schema = rfc2307
ldap_user_object_class = posixAccount
ldap_group_object_class = posixGroup
ldap_default_bind_dn = cn=sssd,ou=services,dc=lab,dc=test
ldap_default_authtok_type = password
ldap_default_authtok = @SSSD_BIND_PASSWORD@
ldap_tls_cacert = /usr/local/share/ca-certificates/lab-ca.crt
ldap_tls_reqcert = demand

# Kerberos
krb5_realm = LAB.TEST
krb5_server = kdc.lab.test
krb5_kpasswd = kdc.lab.test
krb5_validate = true
krb5_canonicalize = false
krb5_ccname_template = FILE:/tmp/krb5cc_%U

# Behaviour
cache_credentials = false
enumerate = false
use_fully_qualified_names = false
fallback_homedir = /home/%u
