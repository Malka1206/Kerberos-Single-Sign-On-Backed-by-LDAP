# Kerberos single sign-on: accept tickets in place of passwords
GSSAPIAuthentication yes
GSSAPICleanupCredentials yes
# The ticket must match the exact service name of this host (host/client1.lab.test)
GSSAPIStrictAcceptorCheck yes

# Password fallback: PAM -> SSSD -> KDC 
UsePAM yes
PasswordAuthentication yes
KbdInteractiveAuthentication yes
